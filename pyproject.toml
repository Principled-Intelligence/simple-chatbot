[project]
name = "simple-chatbot"
version = "0.1.0"
description = "Simple agentic RAG bot with an OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.83.4",
    "chromadb>=1.5.7",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pypdf>=6.10.0",
    "python-docx>=1.2.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.3",
    "orbitals>=0.1.6",
    "openai>=1.50.0",
]

[project.optional-dependencies]
guard-vllm = ["orbitals[scope-guard-vllm]"]
guard-hf = ["orbitals[scope-guard-hf]"]

[project.scripts]
simple-chatbot = "simple_chatbot.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["simple_chatbot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
